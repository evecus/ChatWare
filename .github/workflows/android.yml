name: build-android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

# 与 server.yml 共用同一组，串行追加到同一个 tag 的 Release
concurrency:
  group: chatware-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: arm64-v8a release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 准备 Gradle Wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: 注入签名配置
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEY_STORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "ANDROID_KEYSTORE_FILE=app/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置签名 secrets，release APK 将使用 debug 签名（仅用于测试）"
          fi

      - name: 编译 release APK（仅 arm64-v8a，R8 精简）
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 校验签名与产物
        working-directory: android
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::未找到 APK"; exit 1; fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | head -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "../chatware-arm64-v8a-release.apk"
          ls -lh "../chatware-arm64-v8a-release.apk"

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          files: chatware-arm64-v8a-release.apk
