name: build-server

on:
  workflow_dispatch:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - '.github/workflows/server.yml'

permissions:
  contents: write

jobs:
  build:
    name: linux x64 musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-x64

      - name: 安装 musl 工具链
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 编译 release 单二进制
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: 精简并打包
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/chatware dist/chatware
          strip dist/chatware || true
          cp config.example.toml dist/config.example.toml
          cp README.md dist/README.md
          tar -czf chatware-linux-x64-musl.tar.gz \
            -C dist chatware config.example.toml README.md
          ls -lh dist/chatware chatware-linux-x64-musl.tar.gz

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          files: chatware-linux-x64-musl
