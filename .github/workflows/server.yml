name: build-server

on:
  workflow_dispatch:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - '.github/workflows/server.yml'

permissions:
  contents: write

jobs:
  build:
    name: linux x64 musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-x64

      - name: 安装 musl 工具链
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 编译 release 单二进制
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - run: |
          mkdir dist
          mv target/x86_64-unknown-linux-musl/release/chatware dist/chatware-linux-x86_64
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          files: dist/*
