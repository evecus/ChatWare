# Chatware 服务端配置示例
# 复制为 config.toml 后通过 -c config.toml 加载；也可全部使用默认值。
# 优先级：命令行 -d/--data-dir、--bind > config.toml > 内置默认值
# TLS 由反向代理提供，本程序只监听纯 HTTP。

# 监听地址。建议只监听回环，由 Caddy / Nginx 反代对外提供 HTTPS。
bind = "127.0.0.1:3000"

# 数据目录：redb 数据库、上传文件、初始管理员密码、运行期设置
data_dir = "./data"

# 单个文件上传上限（MB），单请求流式写入磁盘
max_file_size_mb = 100

# 单条消息最大字符数
max_message_length = 4000

# 是否开放注册；关闭后新用户无法注册（管理面板可随时切换）
allow_registration = true

# 面板显示名称
server_name = "Chatware"

# 反代之后的对外地址，仅用于 /admin「客户端连接」页展示与指纹提示
public_url = "https://chat.example.com"
